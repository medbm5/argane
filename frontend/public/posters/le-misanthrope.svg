<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Le Misanthrope — affiche">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0 0.83  0 0 0 0.09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#3B1014"/>
  <g><ellipse cx="300" cy="300" rx="150" ry="200" fill="none" stroke="#F2E8D5" stroke-width="2"/>
     <ellipse cx="300" cy="300" rx="132" ry="182" fill="none" stroke="#F2E8D5" stroke-width="1" opacity=".5"/>
     <line x1="300" y1="170" x2="300" y2="430" stroke="#D4A657" stroke-width="6"/>
     <circle cx="300" cy="150" r="14" fill="#D4A657"/></g>
  <g fill="#F2E8D5" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="600" letter-spacing="-1"><text x="48" y="600" font-size="72">Le</text><text x="48" y="668.4" font-size="72">Misanthrope</text></g>
  <text x="50" y="748" fill="#D4A657" font-family="'Instrument Sans', system-ui, sans-serif" font-size="18" letter-spacing="3">MOLIÈRE</text>
  <text x="552" y="64" fill="#F2E8D5" text-anchor="end" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" letter-spacing="4" opacity=".8">THÉÂTRE · SAISON 26/27</text>
  <text x="48" y="64" fill="#F2E8D5" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic" opacity=".9">Théâtre Argane</text>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>

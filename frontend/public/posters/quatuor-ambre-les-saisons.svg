<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Les Saisons — affiche">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0 0.83  0 0 0 0.09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#4A2C17"/>
  <g><line x1="180" y1="110" x2="180" y2="500" stroke="#FBF6EC" stroke-width="2"/><circle cx="180" cy="180" r="18" fill="#FBF6EC" opacity="0.5"/><line x1="260" y1="110" x2="260" y2="500" stroke="#FBF6EC" stroke-width="3"/><circle cx="260" cy="265" r="22" fill="#FBF6EC" opacity="0.65"/><line x1="340" y1="110" x2="340" y2="500" stroke="#FBF6EC" stroke-width="4"/><circle cx="340" cy="350" r="26" fill="#FBF6EC" opacity="0.8"/><line x1="420" y1="110" x2="420" y2="500" stroke="#FBF6EC" stroke-width="5"/><circle cx="420" cy="435" r="30" fill="#D4A657" opacity="0.95"/></g>
  <g fill="#FBF6EC" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="600" letter-spacing="-1"><text x="48" y="600" font-size="72">Les Saisons</text></g>
  <text x="50" y="748" fill="#D4A657" font-family="'Instrument Sans', system-ui, sans-serif" font-size="18" letter-spacing="3">QUATUOR AMBRE</text>
  <text x="552" y="64" fill="#FBF6EC" text-anchor="end" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" letter-spacing="4" opacity=".8">CONCERT · SAISON 26/27</text>
  <text x="48" y="64" fill="#FBF6EC" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-style="italic" opacity=".9">Théâtre Argane</text>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>

name: argane

services:
  mysql:
    image: mysql:8.0
    command: ["--sql-require-primary-key=ON", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: argane
      MYSQL_USER: argane
      MYSQL_PASSWORD: argane
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      DATABASE_URL: mysql://argane:argane@mysql:3306/argane?serverVersion=8.0&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:

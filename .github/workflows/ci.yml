name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Same MySQL as docker-compose (port 3307, argane/argane), so backend/.env works as is.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: argane_test
          MYSQL_USER: argane
          MYSQL_PASSWORD: argane
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Warm up dev container for PHPStan
        run: php bin/console cache:warmup --env=dev

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Match production (Aiven) and docker-compose: primary keys required, UTC.
      # The app user may create argane_test* databases (parallel test tokens).
      - name: Configure MySQL
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "SET PERSIST sql_require_primary_key = ON; SET PERSIST time_zone = '+00:00'; GRANT ALL PRIVILEGES ON \`argane%\`.* TO 'argane'@'%'; FLUSH PRIVILEGES;"

      - name: Tests
        run: php bin/phpunit

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

security:
    providers:
        app_users:
            entity:
                class: App\Identity\Domain\Model\User
                property: clerkUserId

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: app_users
            custom_authenticators:
                - App\Identity\Api\ClerkAuthenticator

    access_control: []

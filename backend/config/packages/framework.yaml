# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Stateless JSON API: authentication is a bearer token on every request.
    session: false

    # Business-rule violations (409/422/404 from the domain) are expected outcomes,
    # not incidents: keep them out of the error logs.
    exceptions:
        App\Shared\Domain\Exception\DomainException:
            log_level: info

when@test:
    framework:
        test: true

when@prod:
    framework:
        # Render terminates TLS at its proxy. Trust the forwarded headers from the
        # addresses in SYMFONY_TRUSTED_PROXIES (render.yaml: private ranges) so
        # isSecure() is true and HSTS is sent.
        trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

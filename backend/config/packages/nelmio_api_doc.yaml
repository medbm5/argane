nelmio_api_doc:
    documentation:
        info:
            title: Théâtre Argane — Billetterie API
            description: Online and box-office ticketing API. Errors are application/problem+json with a stable `code`.
            version: 1.0.0
        components:
            securitySchemes:
                ClerkJwt:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - ClerkJwt: []
    areas:
        path_patterns:
            - ^/api(?!/doc(\.json)?$)

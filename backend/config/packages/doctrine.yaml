parameters:
    env(DATABASE_SSL_CA): ''
    env(DATABASE_SSL_VERIFY): 'false'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Aiven MySQL requires TLS. In the image, docker/entrypoint.sh decodes
        # DATABASE_SSL_CA_BASE64 to a file, exports its path and turns verification on;
        # on a laptop (e.g. seeding Aiven) set DATABASE_SSL_CA / DATABASE_SSL_VERIFY by hand.
        # Without a CA both options are off and nothing changes.
        options:
            !php/const PDO::MYSQL_ATTR_SSL_CA: '%env(DATABASE_SSL_CA)%'
            !php/const PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: '%env(bool:DATABASE_SSL_VERIFY)%'
        server_version: '8.0'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        # Tables managed outside the ORM (created by migrations / Messenger).
        schema_filter: ~^(?!(order_sequence|messenger_messages)$)~
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        # One attribute mapping per module, added as modules gain entities.
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
                alias: Identity
            Venue:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Venue/Domain/Model'
                prefix: 'App\Venue\Domain\Model'
                alias: Venue
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain/Model'
                prefix: 'App\Catalog\Domain\Model'
                alias: Catalog
            Pricing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Pricing/Domain/Model'
                prefix: 'App\Pricing\Domain\Model'
                alias: Pricing
            Booking:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Booking/Domain/Model'
                prefix: 'App\Booking\Domain\Model'
                alias: Booking
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Domain/Model'
                prefix: 'App\Payment\Domain\Model'
                alias: Payment
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

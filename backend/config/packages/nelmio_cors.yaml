nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'If-None-Match', 'Idempotency-Key']
        expose_headers: ['ETag', 'Content-Disposition', 'Retry-After']
        max_age: 3600
    paths:
        '^/api/': ~

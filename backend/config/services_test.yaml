# Test environment: use cases and adapters are public so functional tests can
# fetch them from the container even before a controller injects them.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    App\:
        resource: '../src/*/{Application,Infrastructure}/'
        exclude:
            - '../src/*/Application/Dto/'
            - '../src/*/Application/Query/View/'
            - '../src/*/Application/Message/'

    # Never call Stripe from tests.
    App\Tests\Support\FakePaymentGateway: ~
    App\Payment\Application\PaymentGateway: '@App\Tests\Support\FakePaymentGateway'

    # Never call Google from tests.
    App\Tests\Support\FakeSheetsClient: ~
    App\Integration\Application\SheetsClient: '@App\Tests\Support\FakeSheetsClient'

# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.currency: '%env(default:app.default_currency:APP_CURRENCY)%'
    app.default_currency: 'mad'
    clerk_default_api_url: 'https://api.clerk.com/v1'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every module (src/<Module>/{Domain,Application,Infrastructure,Api}) is autowired.
    # Entities, value objects and enums are not services.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/Model/'
            - '../src/*/Domain/Event/'
            - '../src/*/Domain/Exception/'
            - '../src/*/Application/Dto/'
            - '../src/*/Api/Dto/'
            - '../src/Shared/Domain/Money.php'

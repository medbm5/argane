; One container, two processes: the HTTP server and the Messenger worker
; (async jobs + Symfony Scheduler: hold expiry, Sheets sync).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
directory=/app
priority=10
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
; Restarts hourly or past 128 MB to stay inside Render free's 512 MB.
command=php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=128M --no-interaction
directory=/app
priority=20
autorestart=true
startsecs=0
startretries=10
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
